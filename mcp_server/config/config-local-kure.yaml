# 로컬 스택 설정: LLM=로컬 vLLM(8012, Qwen3.8-27B-NVFP4), embedder=KURE-v1(로컬 8002, graphiti-eval), DB=FalkorDB(로컬, 볼륨 영속)
server:
  transport: "stdio"
  diagnostics_dir: "/home/jl/coding/graphiti-src/session-work/runtime-observability/asgi"
  # The stdio idle timeout (idle_timeout_seconds) was removed with the MCP SDK 2.x merge
  # (ADR 0005): production runs over HTTP (graphiti-mcp.service), not stdio.

llm:
  provider: "openai"
  model: ${VLLM_MODEL:qwen3.8-27b-nvfp4-a767244d}
  max_tokens: 4096
  structured_output_mode: "json_schema"  # 2026-09-26 실측: vLLM 8012 는 json_schema 를 강제(constrained)한다. json_object 는 thinking off 에서 스키마를 그대로 되돌려 ExtractedEntities 검증 실패
  providers:
    openai:
      api_key: ${VLLM_API_KEY}
      api_url: ${VLLM_API_URL:http://127.0.0.1:8012/v1}
      # Qwen3.8 thinks by default: ~3.5 min/episode measured 2026-09-26 (7s -> 2s per small call
      # with thinking off). Per-request, so the shared vLLM (Hermes) is unaffected.
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

embedder:
  provider: "openai"
  model: "KURE-v1"
  dimensions: 1024
  providers:
    openai:
      api_key: "sk-local-kure"   # KURE 서버는 인증 무시, 형식만 맞춤
      api_url: "http://127.0.0.1:8002/v1"

database:
  provider: "falkordb"
  providers:
    falkordb:
      uri: "redis://localhost:6379"
      password: ${FALKORDB_PASSWORD}
      database: "default_db"

graphiti:
  group_id: "_unassigned"  # 빈 문자열 금지 — add_memory/search 경로가 빈 값에 서로 다르게(둘 다 위험하게) 반응함(실측, ADR 0002)
  user_id: "mcp_user"
  entity_types:
    - name: "Person"
      description: "개인(의뢰인, 변호사, 판사 등)"
    - name: "Organization"
      description: "법무법인, 법원, 기관, 회사"
    - name: "Event"
      description: "기일, 계약 체결/해지, 선고 등 시점 활동"
    - name: "Document"
      description: "준비서면, 판결문, 계약서 등 문서"
    - name: "Location"
      description: "관할 법원, 물리적/가상 장소"
