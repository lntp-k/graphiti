services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "127.0.0.1:6379:6379" # Redis/FalkorDB port — localhost only
    environment:
      - REDIS_ARGS=--requirepass ${FALKORDB_PASSWORD:-} --appendonly yes --appendfsync everysec
      - BROWSER=0
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$FALKORDB_PASSWORD redis-cli -p 6379 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  graphiti-mcp:
    # To use the latest graphiti-core, build locally with:
    #   docker compose -f docker-compose-falkordb.yml build
    # The Docker Hub image may lag behind the latest release.
    image: zepai/knowledge-graph-mcp:standalone
    build:
      context: ..
      dockerfile: docker/Dockerfile.standalone
    env_file:
      - path: ../.env
        required: false
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      # Database configuration
      - FALKORDB_URI=${FALKORDB_URI:-redis://falkordb:6379}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-default_db}
      # Application configuration
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-main}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-10}
      - CONFIG_PATH=/app/mcp/config/config.yaml
    volumes:
      - ../config/config-docker-falkordb.yaml:/app/mcp/config/config.yaml:ro
    ports:
      - "127.0.0.1:8000:8000" # HTTP transport — localhost only, 인증 없는 엔드포인트라 외부 노출 금지
    command: ["uv", "run", "main.py"]

volumes:
  falkordb_data:
    driver: local
